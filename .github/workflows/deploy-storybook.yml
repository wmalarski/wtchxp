name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages and verify the deployment OIDC
# token that `actions/deploy-pages` uses.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time. Let an in-flight deployment finish
# instead of cancelling it, so the published site is never left half-updated.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true

      - name: Build Storybook
        run: vp run build-storybook

      # GitHub Pages runs Jekyll unless this marker exists. Storybook does not
      # need Jekyll, and the marker keeps future `_`-prefixed assets servable.
      - name: Disable Jekyll
        run: touch storybook-static/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
